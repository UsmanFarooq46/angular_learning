<div class="flex items-center justify-between bg-white border-b shadow-sm p-4 z-10 sticky top-0">
    <div class="flex items-center gap-4">
        <!-- Toggle button moved here -->
        <button id="toggleBtn" class="p-1 rounded-md hover:bg-gray-100">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <app-custom-input [input_type]="'text'" [input_id]="'login_email_field'" [label_text]="'Email'"
            [formControl]="emailControl" [placeholder]="'name@example.com'" [haveLabel]="false" />
        <!-- <h1 class="text-2xl font-bold">Dashboard Overview</h1> -->
    </div>

    <!-- Mobile menu button remains -->
    <button id="mobileMenuBtn" class="md:hidden p-2 rounded-md hover:bg-gray-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
    </button>

    <!-- User details added here -->
    <div class="flex items-center gap-3">
        <div class="text-sm text-right">
            <div class="font-medium text-gray-900">Welcome back</div>
            <div class="text-gray-500">Admin User</div>
        </div>
        <div class="h-10 w-10 rounded-full bg-gray-200 flex items-center justify-center text-gray-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
        </div>
    </div>
</div>
