<div class="space-y-2 animate-slide-in delay-200">
  <label [for]="input_id" class="block text-sm font-medium text-gray-700">
    {{ label_text }}
  </label>
  <div class="relative">
    <input
      [id]="input_id"
      [type]="
        input_type != 'password'
          ? input_type
          : passwordVisible
          ? 'text'
          : input_type
      "
      [placeholder]="placeholder"
      [formControl]="formControl"
      class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 pr-10"
    />
    @if (input_type=='password') {
    <button
      type="button"
      id="toggle-password"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 transition-colors"
      (click)="togglePasswordVisibility()"
    >
      @if (passwordVisible) {
      <svg
        id="eye-off-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
        ></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>

      }@else {
      <svg
        id="eye-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      }
    </button>
    }
  </div>
  <div id="password-error" class="text-red-500 text-sm mt-1 hidden-error"></div>
</div>
