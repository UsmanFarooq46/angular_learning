<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-br from-white to-gray-100 p-4"
>
<div class="w-full max-w-lg animate-fade-in">
    <div id="login-form" class="bg-white rounded-lg shadow-lg overflow-hidden">
      <div class="p-8">
        <div class="text-center mb-8">
          <div class="animate-slide-up">
            <h1 class="text-3xl font-bold">Welcome back</h1>
            <p class="text-gray-500 mt-2">
              Enter your credentials to access your account
            </p>
          </div>
        </div>

        <form class="space-y-6" [formGroup]="loginForm">
          <app-custom-input
            [input_type]="'email'"
            [input_id]="'login_email_field'"
            [label_text]="'Email'"
            [formControl]="emailControl" 
            [placeholder]="'name@example.com'"
          />
          <app-custom-input
            [input_type]="'password'"
            [label_text]="'Password'"
            [input_id]="'login_password_id'"
            [formControl]="passwordControl" 
            [placeholder]="'*****'"
          />
          <div
            class="flex items-center justify-between animate-slide-in delay-300"
          >
            <div class="flex items-center space-x-2">
              <input
                type="checkbox"
                id="remember"
                class="h-4 w-4 rounded border-gray-300 text-blue-500 focus:ring-blue-500"
              />
              <label for="remember" class="text-sm font-medium text-gray-700">
                Remember me
              </label>
            </div>
            <a
              href="#"
              class="text-sm font-medium text-blue-500 hover:underline"
            >
              Forgot password?
            </a>
          </div>

          <div class="animate-slide-up delay-400">
            <button
              type="submit"
              id="submit-button"
              (click)="signIn()"
              class="w-full h-11 bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-md transition-colors duration-200 hover-lift scale-press flex items-center justify-center"
            >
              Sign in
            </button>
          </div>
        </form>

        <div class="mt-6">
          <div class="relative">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-xs uppercase">
              <span class="bg-white px-2 text-gray-500">
                Or continue with
              </span>
            </div>
          </div>

          <div class="mt-6 grid grid-cols-2 gap-3">
            <button
              class="w-full flex items-center justify-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-colors duration-200 hover-lift scale-press"
            >
              <svg class="h-5 w-5 mr-2" viewBox="0 0 24 24">
                <g transform="matrix(1, 0, 0, 1, 27.009001, -39.238998)">
                  <path
                    fill="#4285F4"
                    d="M -3.264 51.509 C -3.264 50.719 -3.334 49.969 -3.454 49.239 L -14.754 49.239 L -14.754 53.749 L -8.284 53.749 C -8.574 55.229 -9.424 56.479 -10.684 57.329 L -10.684 60.329 L -6.824 60.329 C -4.564 58.239 -3.264 55.159 -3.264 51.509 Z"
                  />
                  <path
                    fill="#34A853"
                    d="M -14.754 63.239 C -11.514 63.239 -8.804 62.159 -6.824 60.329 L -10.684 57.329 C -11.764 58.049 -13.134 58.489 -14.754 58.489 C -17.884 58.489 -20.534 56.379 -21.484 53.529 L -25.464 53.529 L -25.464 56.619 C -23.494 60.539 -19.444 63.239 -14.754 63.239 Z"
                  />
                  <path
                    fill="#FBBC05"
                    d="M -21.484 53.529 C -21.734 52.809 -21.864 52.039 -21.864 51.239 C -21.864 50.439 -21.724 49.669 -21.484 48.949 L -21.484 45.859 L -25.464 45.859 C -26.284 47.479 -26.754 49.299 -26.754 51.239 C -26.754 53.179 -26.284 54.999 -25.464 56.619 L -21.484 53.529 Z"
                  />
                  <path
                    fill="#EA4335"
                    d="M -14.754 43.989 C -12.984 43.989 -11.404 44.599 -10.154 45.789 L -6.734 42.369 C -8.804 40.429 -11.514 39.239 -14.754 39.239 C -19.444 39.239 -23.494 41.939 -25.464 45.859 L -21.484 48.949 C -20.534 46.099 -17.884 43.989 -14.754 43.989 Z"
                  />
                </g>
              </svg>
              Google
            </button>

            <button
              class="w-full flex items-center justify-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-colors duration-200 hover-lift scale-press"
            >
              <svg
                class="h-5 w-5 mr-2 text-[#1877F2]"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  d="M9.19795 21.5H13.198V13.4901H16.8021L17.198 9.50977H13.198V7.5C13.198 6.94772 13.6457 6.5 14.198 6.5H17.198V2.5H14.198C11.4365 2.5 9.19795 4.73858 9.19795 7.5V9.50977H7.19795L6.80206 13.4901H9.19795V21.5Z"
                ></path>
              </svg>
              Facebook
            </button>
          </div>
        </div>

        <p
          class="mt-8 text-center text-sm text-gray-500 animate-fade-in delay-500"
        >
          Don't have an account?
          <a href="#" class="font-medium text-blue-500 hover:underline">
            Sign up
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
